<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101018">
<title>A little surprise</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#fff;font-family:system-ui,sans-serif;background:radial-gradient(circle at top,#33204b,#101018 62%)}
main{width:min(100%,440px);padding:30px 24px;text-align:center;border:1px solid #ffffff25;border-radius:24px;background:#ffffff0d;box-shadow:0 18px 60px #0008}
.lock{font-size:42px;margin-bottom:10px}h1{margin:8px 0;font-size:25px}p{color:#d2cbdc;line-height:1.5}
input{width:100%;margin:18px 0 12px;padding:16px;border-radius:12px;border:1px solid #ffffff40;background:#0c0b12;color:white;text-align:center;font-size:24px;letter-spacing:10px;outline:none}
button{width:100%;padding:15px;border:0;border-radius:12px;background:#c58cff;color:#1b1026;font-weight:750;font-size:16px;cursor:pointer}
#error{min-height:24px;color:#ff9aab}#video{display:none;margin-top:20px}.frame{position:relative;width:100%;aspect-ratio:16/9}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:14px}.note{font-size:12px;color:#aaa2b5;margin-top:22px}

#video h2{margin:0 0 14px;font-size:clamp(28px,9vw,40px);line-height:1.15;font-weight:900;letter-spacing:1px}
#video h2 .w{display:inline-block;white-space:nowrap;margin:0 .15em}
#video h2 .l{display:inline-block;background:linear-gradient(90deg,#ff5f6d,#ffc371,#fff36b,#6bffb0,#5ec8ff,#c58cff,#ff5f6d);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;opacity:0;transform:translateY(30px) scale(.4) rotate(-12deg);animation:pop .7s cubic-bezier(.2,1.6,.4,1) forwards,shine 3s linear infinite,bob 2s ease-in-out infinite;animation-delay:calc(var(--i)*.07s),0s,calc(.9s + var(--i)*.1s)}
@keyframes pop{to{opacity:1;transform:none}}
@keyframes shine{to{background-position:300% 0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px) rotate(2deg)}}
#sub{margin:0 0 6px;font-size:20px;opacity:0;animation:fade 1s 1.4s forwards}
@keyframes fade{to{opacity:1}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99}
@media (prefers-reduced-motion:reduce){#video h2 .l{animation:pop .01s forwards}}

#poster{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;border-radius:14px;overflow:hidden;cursor:pointer;background:#000}
#poster img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
#poster .play{position:absolute;left:50%;top:50%;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;background:#c58cffee;box-shadow:0 6px 24px #0009;display:grid;place-items:center;animation:pulse 1.8s ease-in-out infinite}
#poster .play::after{content:"";margin-left:5px;border-style:solid;border-width:12px 0 12px 20px;border-color:transparent transparent transparent #1b1026}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
</style>
</head>

    var ps=[];for(var n=0;n<160;n++)ps.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.6,w:6+Math.random()*7,h:10+Math.random()*8,c:colors[n%6],vy:2+Math.random()*3.5,vx:-1.5+Math.random()*3,r:Math.random()*6,vr:-.2+Math.random()*.4});
    var start=performance.now();
    (function frame(now){
      ctx.clearRect(0,0,cv.width,cv.height);
      var alive=false;
      ps.forEach(function(p){p.x+=p.vx+Math.sin(p.y/40);p.y+=p.vy;p.r+=p.vr;
        if(p.y<cv.height+20)alive=true;
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
      if(alive&&now-start<9000)requestAnimationFrame(frame);else ctx.clearRect(0,0,cv.width,cv.height);
    })(start);
  }
  document.getElementById("poster").addEventListener("click", function() {
    document.getElementById("player").src =
      "https://www.youtube-nocookie.com/embed/wZvZ-rJ9qck?autoplay=1&rel=0";
    this.style.display = "none";
  });
  const form = document.getElementById("form");
  const pin = document.getElementById("pin");
  const error = document.getElementById("error");
  form.addEventListener("submit", function(event) {
    event.preventDefault();
    if (pin.value === correctPin) {
      document.getElementById("lock").textContent = "🔓";
      form.style.display = "none";
      document.getElementById("hint").style.display = "none";
      error.textContent = "";
      document.getElementById("video").style.display = "block";
      launchConfetti();
    } else {
      error.textContent = "Incorrect PIN. Please try again.";
      pin.value = "";
      pin.focus();
    }
  });
</script>
</body>
</html>
