<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101018">
<title>A little surprise</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#fff;font-family:system-ui,sans-serif;background:radial-gradient(circle at top,#33204b,#101018 62%)}
main{width:min(100%,440px);padding:30px 24px;text-align:center;border:1px solid #ffffff25;border-radius:24px;background:#ffffff0d;box-shadow:0 18px 60px #0008}
.lock{font-size:42px;margin-bottom:10px}h1{margin:8px 0;font-size:25px}p{color:#d2cbdc;line-height:1.5}
input{width:100%;margin:18px 0 12px;padding:16px;border-radius:12px;border:1px solid #ffffff40;background:#0c0b12;color:white;text-align:center;font-size:24px;letter-spacing:10px;outline:none}
button{width:100%;padding:15px;border:0;border-radius:12px;background:#c58cff;color:#1b1026;font-weight:750;font-size:16px;cursor:pointer}
#error{min-height:24px;color:#ff9aab}#video{display:none;margin-top:20px}.frame{position:relative;width:100%;aspect-ratio:16/9}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:14px}.note{font-size:12px;color:#aaa2b5;margin-top:22px}
</style>
</head>
<body>
<main>
  <div class="lock" id="lock">🔒</div>
  <h1>A little surprise for you</h1>
  <p>Enter the 6-digit PIN to unlock your video.</p>
  <form id="form">
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" minlength="6" placeholder="••••••" aria-label="6-digit PIN" required>
    <button type="submit">Unlock video</button>
  </form>
  <div id="error" role="status"></div>
  <section id="video">
    <h2>Surprise! ❤️</h2>
    <div class="frame"><iframe id="player" title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>
  </section>
  <div class="note">Made with love</div>
</main>
<script>
  // Friendly PIN gate only; this PIN is visible in the public page source.
  const correctPin = "777277";
  const form = document.getElementById("form");
  const pin = document.getElementById("pin");
  const error = document.getElementById("error");
  form.addEventListener("submit", function(event) {
    event.preventDefault();
    if (pin.value === correctPin) {
      document.getElementById("lock").textContent = "🔓";
      form.style.display = "none";
      error.textContent = "";
      document.getElementById("video").style.display = "block";
      document.getElementById("player").src =
        "https://www.youtube-nocookie.com/embed/RgKAFK5djSk?autoplay=1&rel=0";
    } else {
      error.textContent = "Incorrect PIN. Please try again.";
      pin.value = "";
      pin.focus();
    }
  });
</script>
</body>
</html>
